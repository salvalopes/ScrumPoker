services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: scrumpoker-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-}
    ports:
      - "${API_PORT:-5078}:8080"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scrumpoker-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - api